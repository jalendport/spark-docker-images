name: Build and Push
on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      filters:
        required: true
        type: string
      aliases:
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter-shared.outputs.result }}
      readme: ${{ steps.filter.outputs.readme }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Filter paths with changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ${{ inputs.filters }}
      - name: Filter out the paths that are not versions
        id: filter-shared
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: echo "result=$(jq -c '. - ["shared", "readme"]' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      # Images are independent artifacts; one failing must not cancel the rest
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.changes.outputs.images) }}
    if: ${{ needs.changes.outputs.images != '[]' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Get version number
        id: version
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          MATRIX_VERSION: ${{ matrix.version }}
        run: echo "value=${MATRIX_VERSION#"$IMAGE_NAME"-}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        if: ${{ !github.event.act }}
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: ${{ !github.event.act }}
        uses: docker/setup-buildx-action@v3
        with:
          install: true
      - name: Generate dynamic tags
        id: generate-tags
        env:
          ALIASES: ${{ inputs.aliases }}
          ALIAS_KEY: ${{ inputs.image-name }}-${{ steps.version.outputs.value }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAGS="type=raw,value=$VERSION,enable=true,priority=200"
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then
              continue
            fi
            if [[ "$tag" == "latest" ]]; then
              priority=1000
            elif [[ "$tag" == latest-* ]]; then
              priority=900
            else
              priority=200
            fi
            TAGS="$TAGS"$'\n'"type=raw,value=${tag},enable=true,priority=$priority"
          done < <(yq '.[strenv(ALIAS_KEY)] // [] | .[]' <<< "$ALIASES")
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Generate Docker meta
        if: ${{ !github.event.act }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jalendport/spark-${{ inputs.image-name }}
          tags: |
            ${{ steps.generate-tags.outputs.tags }}
      - name: Log in to Docker Hub
        if: ${{ !github.event.act }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        if: ${{ !github.event.act }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.image-name }}/${{ steps.version.outputs.value }}
          file: ${{ inputs.image-name }}/${{ steps.version.outputs.value }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
  # The README is outside the build context and cannot affect the image, so
  # this runs on its own rather than once per version behind a rebuild
  describe:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.readme == 'true' && !github.event.act }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Update Docker image description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: jalendport/spark-${{ inputs.image-name }}
          readme-filepath: ${{ inputs.image-name }}/README.md
          short-description: ${{ github.event.repository.description }}
